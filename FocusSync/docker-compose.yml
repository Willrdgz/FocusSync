services:
  focussync-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: focussync-app
    env_file:
      - .env
    environment:
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
      - "19006:19006"
    volumes:
      - .:/app
      - focussync_node_modules:/app/node_modules
      - focussync_expo_cache:/app/.expo
      - focussync_npm_cache:/app/.npm-cache
    stdin_open: true
    tty: true

volumes:
  focussync_node_modules:
  focussync_expo_cache:
  focussync_npm_cache:
